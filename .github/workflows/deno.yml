name: Render Video
on:
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install moviepy numpy pillow
      - run: python main.py
      - uses: actions/upload-artifact@v4
        with:
          name: hasil-video
          path: "**/*.mp4"
